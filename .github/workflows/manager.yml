name: manager
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: omarchy-mihomo-manager-linux-amd64
          - goarch: arm64
            asset: omarchy-mihomo-manager-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd manager && go mod download
      - run: cd manager && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags='-s -w' -o ../${{ matrix.asset }} ./cmd/omarchy-mihomo-manager
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum omarchy-mihomo-manager-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manager-release
          path: dist
